<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0d0b08">
  <meta name="description" content="Robin Hood – Die Legende von Sherwood. Ein Jump ’n’ Run mit Pfeil und Bogen durch Sherwood Forest, Locksley und Nottingham.">
  <title>Robin Hood – Die Legende von Sherwood</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect x='3' y='5' width='10' height='3' fill='%233f9140'/%3E%3Crect x='6' y='3' width='5' height='2' fill='%233f9140'/%3E%3Crect x='2' y='8' width='12' height='1' fill='%232b6a2f'/%3E%3Crect x='4' y='9' width='8' height='5' fill='%23f0c18e'/%3E%3Crect x='1' y='2' width='2' height='1' fill='%23d6402f'/%3E%3Crect x='3' y='3' width='2' height='1' fill='%23d6402f'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jacquarda+Bastarda+9&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="wrap">
    <canvas id="game" width="480" height="270" aria-label="Robin Hood – Spielfeld"></canvas>
    <div id="touch" aria-hidden="true">
      <div class="pad">
        <div class="tbtn" data-act="left">◀</div>
        <div class="tbtn" data-act="right">▶</div>
        <div class="tbtn small up" data-act="up">▲</div>
        <div class="tbtn small down" data-act="down">▼</div>
      </div>
      <div class="acts">
        <div class="tbtn big shoot" data-act="shoot">Bogen</div>
        <div class="tbtn big jump" data-act="jump">Sprung</div>
      </div>
      <div class="tbtn pause" data-act="pause">II</div>
    </div>
    <noscript>Dieses Spiel braucht JavaScript.</noscript>
  </main>
  <script src="js/core.js"></script>
  <script src="js/levels.js"></script>
  <script src="js/world.js"></script>
  <script src="js/art.js"></script>
  <script src="js/entities.js"></script>
  <script src="js/enemies.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
